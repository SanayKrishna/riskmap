<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Risk Register{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
{% block plotly %}{% endblock %}
</head>
<body>
{% set ep = request.endpoint or '' %}
<div class="app">
  <aside class="side">
    <a class="brand" href="/">
      <!-- 2x2 risk grid, one cell hot -->
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="2" y="2" width="12" height="12" rx="3" fill="#fff" opacity=".35"/>
        <rect x="16" y="2" width="12" height="12" rx="3" fill="#F2994A"/>
        <rect x="2" y="16" width="12" height="12" rx="3" fill="#fff" opacity=".2"/>
        <rect x="16" y="16" width="12" height="12" rx="3" fill="#fff" opacity=".55"/>
      </svg>
      <div><b>Risk Register</b><span>Response planner</span></div>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="/" class="{{ 'on' if ep in ('index', 'analyze') }}">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><path d="M14.5 11.5v6M11.5 14.5h6"/></svg>
        Analyze</a>
      <a href="/results" class="{{ 'on' if ep in ('results', 'export') }}">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="4.6" height="4.6" rx="1" opacity=".35"/><rect x="7.7" y="2" width="4.6" height="4.6" rx="1" opacity=".6"/><rect x="13.4" y="2" width="4.6" height="4.6" rx="1"/><rect x="2" y="7.7" width="4.6" height="4.6" rx="1" opacity=".2"/><rect x="7.7" y="7.7" width="4.6" height="4.6" rx="1" opacity=".5"/><rect x="13.4" y="7.7" width="4.6" height="4.6" rx="1" opacity=".8"/><rect x="2" y="13.4" width="4.6" height="4.6" rx="1" opacity=".2"/><rect x="7.7" y="13.4" width="4.6" height="4.6" rx="1" opacity=".35"/><rect x="13.4" y="13.4" width="4.6" height="4.6" rx="1" opacity=".6"/></svg>
        Report</a>
      <a href="/history" class="{{ 'on' if ep in ('history', 'snapshot') }}">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 15l4.5-5.5 3.5 3 6.5-8"/><circle cx="7" cy="9.5" r="1.2" fill="currentColor"/><circle cx="10.5" cy="12.5" r="1.2" fill="currentColor"/><circle cx="17" cy="4.5" r="1.2" fill="currentColor"/></svg>
        History</a>
      <a href="/security" class="{{ 'on' if ep == 'security' }}">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2l6.5 2.5v5c0 4-2.7 6.7-6.5 8-3.8-1.3-6.5-4-6.5-8v-5z"/><path d="M7 10l2.2 2.2L13.2 8"/></svg>
        Security log</a>
    </nav>
    <p class="side-note">Scored locally. Gemini sees High &amp; Critical risks only.</p>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
